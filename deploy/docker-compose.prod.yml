name: hafsa

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-funnel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-funnel}
      POSTGRES_DB: ${POSTGRES_DB:-funnel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-funnel} -d ${POSTGRES_DB:-funnel}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  telegram-bot-api:
    image: aiogram/telegram-bot-api:10.3
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - tgbotapi:/var/lib/telegram-bot-api
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-3101}:3001"
    env_file: .env.prod
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-funnel}:${POSTGRES_PASSWORD:-funnel}@postgres:5432/${POSTGRES_DB:-funnel}
    volumes:
      - tgbotapi:/var/lib/telegram-bot-api
    depends_on:
      postgres:
        condition: service_healthy
      telegram-bot-api:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M

  # Optional: only used on bare VPS without host Nginx (docker compose --profile caddy up -d)
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    profiles:
      - caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  tgbotapi:
  caddy_data:
  caddy_config:
