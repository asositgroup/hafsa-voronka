name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: funnel
          POSTGRES_PASSWORD: funnel
          POSTGRES_DB: funnel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://funnel:funnel@localhost:5432/funnel_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm --filter @funnel/web build
        env:
          NEXT_PUBLIC_API_URL: https://api.yourdomain.uz
          NEXT_PUBLIC_BOT_USERNAME: your_bot

      - run: pnpm --filter @funnel/api build

      - run: docker build -f apps/api/Dockerfile .
